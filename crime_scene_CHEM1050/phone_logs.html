<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forensic SMS Log Examiner - CASE-0247</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #27354a;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --accent: #a855f7;
      --badge-auto: #64748b;
      --bubble-sent: #0369a1;
      --bubble-recv: #334155;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 20px;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .case-info h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-case {
      font-size: 0.75rem;
      background: var(--primary-dark);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
    }

    .case-meta {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .stats-pill {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      text-align: right;
    }
    .stats-pill .count {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
    }
    .stats-pill .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Filter Controls Panel */
    .controls {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      align-items: end;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 9px 12px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-secondary {
      background: #334155;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #475569;
    }

    .btn-toggle {
      background: #0f172a;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-toggle.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
    }

    /* View Switcher */
    .view-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .view-tabs {
      display: flex;
      gap: 6px;
    }

    /* Table View */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    thead th {
      background-color: #162032;
      color: var(--text-muted);
      padding: 12px 16px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    thead th:hover {
      color: #fff;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background-color 0.15s;
    }

    tbody tr:hover {
      background-color: var(--bg-card-hover);
    }

    td {
      padding: 12px 16px;
      vertical-align: top;
    }

    .id-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .party {
      display: flex;
      flex-direction: column;
    }
    .party-name {
      font-weight: 600;
      color: #fff;
    }
    .party-phone {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .timestamp {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .type-pill {
      font-size: 0.7rem;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      display: inline-block;
    }
    .type-sms { background: rgba(56, 189, 248, 0.2); color: var(--primary); }
    .type-automated { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }

    .msg-content {
      color: #e2e8f0;
      word-break: break-word;
      line-height: 1.45;
    }

    /* Bubble / Conversation View */
    .conversation-view {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 10px 0;
      max-width: 850px;
      margin: 0 auto;
    }

    .chat-bubble-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      position: relative;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 6px;
    }

    .chat-parties {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-parties strong {
      color: #fff;
    }
    .arrow {
      color: var(--primary);
    }

    .chat-body {
      font-size: 0.95rem;
      color: #f1f5f9;
      margin-top: 8px;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Highlight Search */
    mark {
      background: rgba(250, 204, 21, 0.4);
      color: #fff;
      padding: 0 2px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="case-info">
        <h1>
          Case SMS Log Archive
          <span class="badge-case" id="caseId">CASE-0247</span>
        </h1>
        <div class="case-meta">
          <span id="caseTitle">"A Love That Shouldn't Have Been"</span>
          <span>•</span>
          <span id="caseTz">America/Chicago</span>
          <span>•</span>
          <span>Dataset: SMS Extraction Export</span>
        </div>
      </div>
      <div class="stats-pill">
        <div class="count" id="displayCount">0 / 0</div>
        <div class="label">Messages Displayed</div>
      </div>
    </header>

    <!-- Filters & Sort Controls -->
    <div class="controls">
      <!-- Search -->
      <div class="control-group">
        <label for="searchQuery">Search Text</label>
        <input type="text" id="searchQuery" placeholder="Filter message content..." />
      </div>

      <!-- Specific Sender -->
      <div class="control-group">
        <label for="filterSender">Sender</label>
        <select id="filterSender">
          <option value="">All Senders</option>
        </select>
      </div>

      <!-- Specific Receiver -->
      <div class="control-group">
        <label for="filterReceiver">Receiver</label>
        <select id="filterReceiver">
          <option value="">All Receivers</option>
        </select>
      </div>

      <!-- Conversation Pair Filter -->
      <div class="control-group">
        <label for="filterPair">Two-Way Conversation</label>
        <select id="filterPair">
          <option value="">All Dialogues</option>
        </select>
      </div>

      <!-- Type Filter -->
      <div class="control-group">
        <label for="filterType">Message Type</label>
        <select id="filterType">
          <option value="">All Types</option>
          <option value="sms">SMS Only</option>
          <option value="automated">Automated Only</option>
        </select>
      </div>

      <!-- Sort Order -->
      <div class="control-group">
        <label for="sortOrder">Sort By</label>
        <select id="sortOrder">
          <option value="time-asc">Time (Oldest First)</option>
          <option value="time-desc">Time (Newest First)</option>
          <option value="sender-asc">Sender Name (A → Z)</option>
          <option value="record-asc">Record ID (Asc)</option>
        </select>
      </div>

      <!-- Actions -->
      <div class="control-group btn-row">
        <button class="btn btn-secondary" id="resetBtn" style="flex: 1;">Reset Filters</button>
      </div>
    </div>

    <!-- View Switcher -->
    <div class="view-toolbar">
      <div class="view-tabs">
        <button class="btn btn-toggle active" id="tabTable">Table View</button>
        <button class="btn btn-toggle" id="tabChat">Dialogue / Feed View</button>
      </div>
      <div style="font-size: 0.8rem; color: var(--text-muted);" id="summaryStatus"></div>
    </div>

    <!-- Table View Section -->
    <div id="tableView" class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 85px;">ID</th>
            <th style="width: 170px;">Date &amp; Time</th>
            <th style="width: 190px;">From (Sender)</th>
            <th style="width: 190px;">To (Receiver)</th>
            <th>Message</th>
            <th style="width: 90px;">Type</th>
          </tr>
        </thead>
        <tbody id="logsTableBody">
          <!-- Dynamic Content -->
        </tbody>
      </table>
    </div>

    <!-- Dialogue / Thread View Section -->
    <div id="chatView" class="conversation-view" style="display: none;">
      <!-- Dynamic Content -->
    </div>

  </div>

    // State
    let activeView = 'table';
    const totalRecords = RAW_DATA.messages.length;

    // DOM Elements
    const senderSelect = document.getElementById('filterSender');
    const receiverSelect = document.getElementById('filterReceiver');
    const pairSelect = document.getElementById('filterPair');
    const typeSelect = document.getElementById('filterType');
    const sortSelect = document.getElementById('sortOrder');
    const searchInput = document.getElementById('searchQuery');
    const resetBtn = document.getElementById('resetBtn');
    const displayCount = document.getElementById('displayCount');
    const summaryStatus = document.getElementById('summaryStatus');

    const tableView = document.getElementById('tableView');
    const chatView = document.getElementById('chatView');
    const tabTable = document.getElementById('tabTable');
    const tabChat = document.getElementById('tabChat');

    // Init Header Information
    document.getElementById('caseId').textContent = RAW_DATA.case_id;
    document.getElementById('caseTitle').textContent = `"${RAW_DATA.title}"`;
    document.getElementById('caseTz').textContent = RAW_DATA.timezone;

    // Populate Dropdown Menus
    function populateDropdowns() {
      const contacts = RAW_DATA.contacts;

      contacts.forEach(c => {
        // Sender option
        const optS = document.createElement('option');
        optS.value = c.phone;
        optS.textContent = `${c.name} (${c.phone})`;
        senderSelect.appendChild(optS);

        // Receiver option
        const optR = document.createElement('option');
        optR.value = c.phone;
        optR.textContent = `${c.name} (${c.phone})`;
        receiverSelect.appendChild(optR);
      });

      // Populate unique dialogue pairs
      const pairMap = new Map();
      RAW_DATA.messages.forEach(m => {
        const p1 = m.sender_name;
        const p2 = m.receiver_name;
        const key = [p1, p2].sort().join(" ⇄ ");
        pairMap.set(key, { p1: m.sender, p2: m.receiver, label: key });
      });

      pairMap.forEach((val, key) => {
        const optP = document.createElement('option');
        optP.value = key;
        optP.textContent = key;
        pairSelect.appendChild(optP);
      });
    }

    // Format timestamps for legibility
    function formatTime(isoStr) {
      const d = new Date(isoStr);
      return d.toLocaleString("en-US", {
        month: "short",
        day: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    // Highlight query helper
    function highlight(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escaped})`, 'gi');
      return text.replace(regex, '<mark>$1</mark>');
    }

    // Filter and Sort Engine
    function getProcessedMessages() {
      const q = searchInput.value.trim().toLowerCase();
      const sVal = senderSelect.value;
      const rVal = receiverSelect.value;
      const pairVal = pairSelect.value;
      const tVal = typeSelect.value;
      const sortVal = sortSelect.value;

      let filtered = RAW_DATA.messages.filter(msg => {
        // Sender filter
        if (sVal && msg.sender !== sVal) return false;

        // Receiver filter
        if (rVal && msg.receiver !== rVal) return false;

        // Message type filter
        if (tVal && msg.message_type !== tVal) return false;

        // Pair filter (two-way)
        if (pairVal) {
          const currentPair = [msg.sender_name, msg.receiver_name].sort().join(" ⇄ ");
          if (currentPair !== pairVal) return false;
        }

        // Text search (content + party names)
        if (q) {
          const textMatch = msg.message.toLowerCase().includes(q);
          const senderMatch = msg.sender_name.toLowerCase().includes(q);
          const receiverMatch = msg.receiver_name.toLowerCase().includes(q);
          if (!textMatch && !senderMatch && !receiverMatch) return false;
        }

        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        if (sortVal === 'time-asc') return new Date(a.timestamp) - new Date(b.timestamp);
        if (sortVal === 'time-desc') return new Date(b.timestamp) - new Date(a.timestamp);
        if (sortVal === 'sender-asc') return a.sender_name.localeCompare(b.sender_name);
        if (sortVal === 'record-asc') return a.record_id.localeCompare(b.record_id);
        return 0;
      });

      return filtered;
    }

    // Render Data to Active View
    function render() {
      const messages = getProcessedMessages();
      const q = searchInput.value.trim();

      displayCount.textContent = `${messages.length} / ${totalRecords}`;
      summaryStatus.textContent = `Showing ${messages.length} event${messages.length === 1 ? '' : 's'}`;

      if (activeView === 'table') {
        const tbody = document.getElementById('logsTableBody');
        if (messages.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No records matching the filter criteria.</td></tr>`;
          return;
        }

        tbody.innerHTML = messages.map(m => `
          <tr>
            <td><span class="id-tag">${m.record_id}</span></td>
            <td><span class="timestamp">${formatTime(m.timestamp)}</span></td>
            <td>
              <div class="party">
                <span class="party-name">${highlight(m.sender_name, q)}</span>
                <span class="party-phone">${m.sender}</span>
              </div>
            </td>
            <td>
              <div class="party">
                <span class="party-name">${highlight(m.receiver_name, q)}</span>
                <span class="party-phone">${m.receiver}</span>
              </div>
            </td>
            <td class="msg-content">${highlight(m.message, q)}</td>
            <td>
              <span class="type-pill ${m.message_type === 'sms' ? 'type-sms' : 'type-automated'}">
                ${m.message_type}
              </span>
            </td>
          </tr>
        `).join('');
      } else {
        // Chat Dialogue view
        if (messages.length === 0) {
          chatView.innerHTML = `<div class="empty-state">No conversation records matching the filter criteria.</div>`;
          return;
        }

        chatView.innerHTML = messages.map(m => `
          <div class="chat-bubble-card">
            <div class="chat-header">
              <div class="chat-parties">
                <span class="id-tag">${m.record_id}</span>
                <strong>${highlight(m.sender_name, q)}</strong>
                <span class="arrow">➔</span>
                <span>${highlight(m.receiver_name, q)}</span>
              </div>
              <span class="timestamp">${formatTime(m.timestamp)}</span>
            </div>
            <div class="chat-body">${highlight(m.message, q)}</div>
          </div>
        `).join('');
      }
    }

    // Reset All Filters
    function resetFilters() {
      searchInput.value = '';
      senderSelect.value = '';
      receiverSelect.value = '';
      pairSelect.value = '';
      typeSelect.value = '';
      sortSelect.value = 'time-asc';
      render();
    }

    // Event Listeners
    [searchInput, senderSelect, receiverSelect, pairSelect, typeSelect, sortSelect].forEach(el => {
      el.addEventListener('input', render);
    });

    resetBtn.addEventListener('click', resetFilters);

    tabTable.addEventListener('click', () => {
      activeView = 'table';
      tabTable.classList.add('active');
      tabChat.classList.remove('active');
      tableView.style.display = 'block';
      chatView.style.display = 'none';
      render();
    });

    tabChat.addEventListener('click', () => {
      activeView = 'chat';
      tabChat.classList.add('active');
      tabTable.classList.remove('active');
      tableView.style.display = 'none';
      chatView.style.display = 'flex';
      render();
    });

    // Initial boot
    populateDropdowns();
    render();
  </script>
